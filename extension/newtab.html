<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>새 탭</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-left">
        <div>
          <div id="clock" class="clock"></div>
          <div id="today" class="today"></div>
        </div>
        <div id="weather" class="weather"></div>
      </div>
      <div class="status">
        <span id="updated"></span>
        <button id="refresh" type="button">새로고침</button>
        <button id="settings" type="button">설정</button>
      </div>
    </header>
    <p id="notice" class="notice" hidden></p>
    <section id="favorites" class="favorites"></section>
    <main class="columns">
      <section class="column" id="jobs"></section>
      <section class="column" id="gpu"></section>
    </main>
    <section id="log" class="log"></section>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
